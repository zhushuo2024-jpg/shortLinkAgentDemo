
spring:
  application:
    name: jchat-mind-demo
  ai:
    anthropic:
      # 你的中转地址，Spring AI 内部会自动补齐 /v1/messages
      base-url: https://www.nbwcode.top/
      # 优先从环境变量读取，如果没有配，可以直接替换成你的 sk-xxx token 进行测试
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          # 如果中转不支持这个模型，请去中转控制台看看它支持的模型名
          model: claude-opus-5
          max-tokens: 1024